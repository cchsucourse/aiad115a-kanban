<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天氣與狗狗資訊看板 - Weather & Dog Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.12)',
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.75), rgba(2, 6, 23, 0.85)), url('https://cdn.pixabay.com/photo/2017/03/14/17/43/mountain-2143877_1280.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card-hover:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        @keyframes pulse-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .animate-pulse-slow {
            animation: pulse-slow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">

    <!-- Header Navigation -->
    <header class="w-full border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-sky-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <i class="fa-solid font-bold text-white text-lg fa-cloud-sun-rain"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
                        天氣 & 狗狗資訊看板
                    </h1>
                    <p class="text-xs text-slate-400 flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 inline-block animate-pulse"></span>
                        即時連線中
                    </p>
                </div>
            </div>

            <!-- Header Clock & Quick Refresh -->
            <div class="flex items-center space-x-4">
                <div class="hidden md:flex flex-col items-end text-right">
                    <span id="current-time" class="text-sm font-semibold tracking-wider text-slate-200">--:--:--</span>
                    <span id="current-date" class="text-xs text-slate-400">----/--/--</span>
                </div>
                <button id="btn-global-refresh" title="重新整理所有資料" 
                    class="p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700/80 text-slate-300 hover:text-white transition border border-slate-700/60 active:scale-95">
                    <i id="icon-global-refresh" class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Banner Alert / Geolocation Notification -->
        <div id="status-toast" class="hidden rounded-xl p-4 bg-indigo-950/60 border border-indigo-500/30 text-indigo-200 text-sm flex items-center justify-between">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-circle-info text-indigo-400 text-base"></i>
                <span id="status-message">正在取得您的位置...</span>
            </div>
            <button onclick="document.getElementById('status-toast').classList.add('hidden')" class="text-indigo-400 hover:text-indigo-200">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Dashboard Grid Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

            <!-- LEFT COLUMN: WEATHER CARD (5 Cols on LG) -->
            <section class="lg:col-span-5 space-y-6">
                
                <!-- Weather Main Card -->
                <div class="glass-card glass-card-hover rounded-2xl p-6 relative overflow-hidden shadow-2xl">
                    <!-- Subtle background glow -->
                    <div class="absolute -top-12 -left-12 w-40 h-40 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-12 -right-12 w-40 h-40 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                    <!-- Header & Location Selector -->
                    <div class="flex items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-700/50">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-location-dot text-sky-400 text-lg"></i>
                            <h2 class="font-semibold text-slate-200 text-base">城市地區</h2>
                        </div>

                        <!-- City Select Dropdown -->
                        <div class="relative">
                            <select id="city-select" class="appearance-none bg-slate-800/90 border border-slate-700 text-slate-200 text-xs sm:text-sm rounded-xl px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-sky-500/50 cursor-pointer">
                                <option value="auto">📍 自動定位 (GPS)</option>
                                <option value="taipei">臺北市 (Taipei)</option>
                                <option value="newtaipei">新北市 (New Taipei)</option>
                                <option value="taichung">臺中市 (Taichung)</option>
                                <option value="tainan">臺南市 (Tainan)</option>
                                <option value="kaohsiung">高雄市 (Kaohsiung)</option>
                                <option value="hualien">花蓮縣 (Hualien)</option>
                                <option value="taitung">臺東縣 (Taitung)</option>
                                <option value="tokyo">東京 (Tokyo)</option>
                                <option value="london">倫敦 (London)</option>
                                <option value="newyork">紐約 (New York)</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
                        </div>
                    </div>

                    <!-- Weather Loading Skeleton -->
                    <div id="weather-skeleton" class="space-y-4 animate-pulse">
                        <div class="flex justify-between items-center">
                            <div class="space-y-2">
                                <div class="h-10 w-28 bg-slate-700/60 rounded-lg"></div>
                                <div class="h-4 w-20 bg-slate-700/40 rounded"></div>
                            </div>
                            <div class="w-16 h-16 bg-slate-700/60 rounded-full"></div>
                        </div>
                        <div class="grid grid-cols-2 gap-3 pt-4">
                            <div class="h-16 bg-slate-700/40 rounded-xl"></div>
                            <div class="h-16 bg-slate-700/40 rounded-xl"></div>
                        </div>
                    </div>

                    <!-- Weather Info Content -->
                    <div id="weather-content" class="hidden">
                        <!-- Main Temp & Weather Condition -->
                        <div class="flex items-center justify-between mb-6">
                            <div>
                                <div class="flex items-baseline gap-1">
                                    <span id="weather-temp" class="text-5xl font-extrabold tracking-tight text-white">25</span>
                                    <span class="text-2xl font-light text-sky-400">°C</span>
                                </div>
                                <p id="weather-desc" class="text-sm font-medium text-slate-300 mt-1 flex items-center gap-1.5">
                                    多雲時晴
                                </p>
                                <p id="weather-location-name" class="text-xs text-slate-400 mt-0.5">
                                    <i class="fa-solid fa-compass text-slate-500"></i> <span id="location-display-text">臺北市</span>
                                </p>
                            </div>
                            <div id="weather-icon-wrapper" class="text-5xl text-sky-400 drop-shadow-lg p-2">
                                <i class="fa-solid fa-cloud-sun"></i>
                            </div>
                        </div>

                        <!-- Secondary Metrics Grid -->
                        <div class="grid grid-cols-2 gap-3 mb-6">
                            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700/40 flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg bg-orange-500/10 text-orange-400 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-temperature-three-quarters text-sm"></i>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">體感溫度</p>
                                    <p id="weather-apparent" class="text-sm font-semibold text-slate-200">26 °C</p>
                                </div>
                            </div>

                            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700/40 flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-droplet text-sm"></i>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">相對濕度</p>
                                    <p id="weather-humidity" class="text-sm font-semibold text-slate-200">70 %</p>
                                </div>
                            </div>

                            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700/40 flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg bg-teal-500/10 text-teal-400 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-wind text-sm"></i>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">風速</p>
                                    <p id="weather-wind" class="text-sm font-semibold text-slate-200">12 km/h</p>
                                </div>
                            </div>

                            <div class="bg-slate-800/50 rounded-xl p-3 border border-slate-700/40 flex items-center gap-3">
                                <div class="w-9 h-9 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center shrink-0">
                                    <i class="fa-solid fa-clock-rotate-left text-sm"></i>
                                </div>
                                <div>
                                    <p class="text-xs text-slate-400">下次天氣更新</p>
                                    <p id="weather-next-update" class="text-xs font-medium text-slate-300">15 分鐘後</p>
                                </div>
                            </div>
                        </div>

                        <!-- 3-Day Forecast Section -->
                        <div>
                            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">未來 3 日預報</p>
                            <div id="forecast-container" class="grid grid-cols-3 gap-2">
                                <!-- Dynamic forecast items will be inserted here -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AI Weather & Dog Companion Prompt -->
                <div class="glass-card rounded-2xl p-4 border border-slate-700/50">
                    <div class="flex items-start gap-3">
                        <div class="w-8 h-8 rounded-lg bg-purple-500/20 text-purple-400 flex items-center justify-center shrink-0 mt-0.5">
                            <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="text-xs font-semibold text-purple-300">汪汪氣象溫馨提醒</h3>
                                <button id="btn-generate-ai-tip" class="text-[11px] text-purple-400 hover:text-purple-300 underline font-medium">
                                    生成叮嚀
                                </button>
                            </div>
                            <p id="ai-tip-text" class="text-xs text-slate-300 leading-relaxed italic">
                                「今天適合散步嗎？快按下生成叮嚀，讓 AI 狗狗為您評估天氣吧！」
                            </p>
                        </div>
                    </div>
                </div>

            </section>

            <!-- RIGHT COLUMN: DOG PHOTO CARD (7 Cols on LG) -->
            <section class="lg:col-span-7 space-y-6">
                
                <div class="glass-card glass-card-hover rounded-2xl p-6 relative overflow-hidden shadow-2xl flex flex-col justify-between">
                    
                    <!-- Card Header -->
                    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-700/50">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-dog text-amber-400 text-lg"></i>
                            <h2 class="font-semibold text-slate-200 text-base">今日汪星人</h2>
                        </div>
                        
                        <!-- Breed Badge Tag -->
                        <div id="dog-breed-badge" class="px-3 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-medium flex items-center gap-1.5">
                            <i class="fa-solid fa-paw text-[10px]"></i>
                            <span id="dog-breed-name">載入品種中...</span>
                        </div>
                    </div>

                    <!-- Dog Photo Container with Fixed Aspect Ratio -->
                    <div class="relative w-full h-[360px] sm:h-[420px] rounded-xl overflow-hidden bg-slate-800/80 border border-slate-700/60 flex items-center justify-center group">
                        
                        <!-- Loading Spinner -->
                        <div id="dog-loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm z-10 transition-opacity duration-300">
                            <div class="w-12 h-12 border-4 border-amber-400/20 border-t-amber-400 rounded-full animate-spin mb-3"></div>
                            <p class="text-xs text-slate-400 font-medium animate-pulse">正在尋找可愛狗狗...</p>
                        </div>

                        <!-- Dog Image -->
                        <img id="dog-image" src="" alt="Dog Photo" 
                            class="w-full h-full object-cover object-center transition-transform duration-500 group-hover:scale-105 opacity-0">

                        <!-- Favorite Overlay Button -->
                        <button id="btn-favorite-dog" title="收藏這張相片"
                            class="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-900/60 hover:bg-slate-900/90 text-slate-300 hover:text-rose-500 backdrop-blur-md border border-white/20 flex items-center justify-center transition active:scale-90 z-20">
                            <i id="icon-favorite-heart" class="fa-regular fa-heart text-lg"></i>
                        </button>
                    </div>

                    <!-- Auto-refresh Progress Bar & Controls -->
                    <div class="mt-5 space-y-4">
                        <!-- Progress Bar Container -->
                        <div>
                            <div class="flex items-center justify-between text-xs text-slate-400 mb-1.5">
                                <span class="flex items-center gap-1.5">
                                    <i class="fa-solid fa-rotate text-[10px] text-amber-400"></i>
                                    自動輪播倒數
                                </span>
                                <span id="dog-countdown-text" class="font-mono font-medium text-slate-300">60s</span>
                            </div>
                            <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden">
                                <div id="dog-progress-bar" class="h-full bg-gradient-to-r from-amber-500 to-orange-400 rounded-full transition-all duration-1000 ease-linear" style="width: 100%;"></div>
                            </div>
                        </div>

                        <!-- Control Buttons -->
                        <div class="flex items-center justify-between gap-3 pt-1">
                            <button id="btn-prev-favorite" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700/80 border border-slate-700 text-xs font-medium text-slate-300 hover:text-white transition flex items-center gap-2">
                                <i class="fa-solid fa-bookmark text-rose-400"></i>
                                <span>我的收藏 (<span id="favorite-count">0</span>)</span>
                            </button>

                            <button id="btn-next-dog" class="flex-1 sm:flex-initial px-6 py-2.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-semibold text-sm shadow-lg shadow-orange-500/20 active:scale-95 transition flex items-center justify-center gap-2">
                                <i id="icon-next-dog" class="fa-solid fa-dog"></i>
                                <span>換一張狗狗</span>
                            </button>
                        </div>
                    </div>
                </div>

            </section>
        </div>

        <!-- Favorite Dogs Modal -->
        <div id="favorites-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
            <div class="glass-card rounded-2xl w-full max-w-2xl max-h-[80vh] flex flex-col overflow-hidden border border-slate-700">
                <div class="p-4 sm:p-6 border-b border-slate-700/80 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-heart text-rose-500 text-lg"></i>
                        <h3 class="text-base font-bold text-slate-100">已收藏的狗狗相片</h3>
                    </div>
                    <button id="btn-close-modal" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                <div id="favorites-grid" class="p-4 sm:p-6 overflow-y-auto grid grid-cols-2 sm:grid-cols-3 gap-4 flex-1">
                    <!-- Favorite items injected here -->
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-800/80 bg-slate-900/40 py-4 text-center text-xs text-slate-500">
        <p>資料來源：<a href="https://open-meteo.com/" target="_blank" class="underline hover:text-slate-400">Open-Meteo API</a> & <a href="https://dog.ceo/dog-api/" target="_blank" class="underline hover:text-slate-400">Dog CEO API</a></p>
    </footer>

    <script>
        // Configuration & Constants
        const DOG_REFRESH_INTERVAL_SEC = 60;
        const WEATHER_REFRESH_INTERVAL_MIN = 15;
        
        // City Coordinates Preset
        const CITIES = {
            'taipei': { name: '臺北市', lat: 25.0330, lon: 121.5654 },
            'newtaipei': { name: '新北市', lat: 24.9980, lon: 121.4930 },
            'taichung': { name: '臺中市', lat: 24.1477, lon: 120.6736 },
            'tainan': { name: '臺南市', lat: 22.9997, lon: 120.2270 },
            'kaohsiung': { name: '高雄市', lat: 22.6273, lon: 120.3014 },
            'hualien': { name: '花蓮縣', lat: 23.9871, lon: 121.6015 },
            'taitung': { name: '臺東縣', lat: 22.7613, lon: 121.1444 },
            'tokyo': { name: '東京', lat: 35.6762, lon: 139.6503 },
            'london': { name: '倫敦', lat: 51.5074, lon: -0.1278 },
            'newyork': { name: '紐約', lat: 40.7128, lon: -74.0060 }
        };

        // Application State
        let state = {
            currentLat: CITIES['taipei'].lat,
            currentLon: CITIES['taipei'].lon,
            currentLocationName: CITIES['taipei'].name,
            currentWeatherData: null,
            currentDogUrl: '',
            currentDogBreed: '',
            dogCountdown: DOG_REFRESH_INTERVAL_SEC,
            favorites: JSON.parse(localStorage.getItem('favorite_dogs') || '[]'),
            dogTimer: null,
            weatherTimer: null
        };

        // WMO Weather Interpretation Codes mapping
        const WMO_CODES = {
            0: { desc: '晴朗', icon: 'fa-sun text-amber-400' },
            1: { desc: '主要晴朗', icon: 'fa-cloud-sun text-amber-300' },
            2: { desc: '局部多雲', icon: 'fa-cloud-sun text-slate-300' },
            3: { desc: '陰天', icon: 'fa-cloud text-slate-400' },
            45: { desc: '有霧', icon: 'fa-smog text-slate-400' },
            48: { desc: '霧淞', icon: 'fa-smog text-slate-400' },
            51: { desc: '輕微毛毛雨', icon: 'fa-cloud-rain text-sky-300' },
            53: { desc: '毛毛雨', icon: 'fa-cloud-rain text-sky-400' },
            55: { desc: '強毛毛雨', icon: 'fa-cloud-showers-heavy text-sky-500' },
            61: { desc: '小雨', icon: 'fa-cloud-rain text-blue-400' },
            63: { desc: '中雨', icon: 'fa-cloud-showers-heavy text-blue-500' },
            65: { desc: '大雨', icon: 'fa-cloud-showers-heavy text-blue-600' },
            71: { desc: '輕微降雪', icon: 'fa-snowflake text-indigo-200' },
            73: { desc: '降雪', icon: 'fa-snowflake text-indigo-300' },
            75: { desc: '強降雪', icon: 'fa-snowflake text-indigo-400' },
            80: { desc: '陣雨', icon: 'fa-cloud-sun-rain text-sky-400' },
            81: { desc: '強烈陣雨', icon: 'fa-cloud-showers-heavy text-sky-500' },
            82: { desc: '暴雨', icon: 'fa-cloud-showers-water text-blue-600' },
            95: { desc: '雷陣雨', icon: 'fa-bolt text-amber-400' },
            96: { desc: '雷陣雨伴隨冰雹', icon: 'fa-bolt-lightning text-amber-500' },
            99: { desc: '強烈冰雹雷暴', icon: 'fa-burst text-amber-500' }
        };

        // DOM Elements
        const elTime = document.getElementById('current-time');
        const elDate = document.getElementById('current-date');
        const elCitySelect = document.getElementById('city-select');
        const elStatusToast = document.getElementById('status-toast');
        const elStatusMessage = document.getElementById('status-message');
        
        const elWeatherSkeleton = document.getElementById('weather-skeleton');
        const elWeatherContent = document.getElementById('weather-content');
        const elWeatherTemp = document.getElementById('weather-temp');
        const elWeatherDesc = document.getElementById('weather-desc');
        const elWeatherApparent = document.getElementById('weather-apparent');
        const elWeatherHumidity = document.getElementById('weather-humidity');
        const elWeatherWind = document.getElementById('weather-wind');
        const elWeatherIconWrapper = document.getElementById('weather-icon-wrapper');
        const elLocationDisplayText = document.getElementById('location-display-text');
        const elForecastContainer = document.getElementById('forecast-container');

        const elDogImage = document.getElementById('dog-image');
        const elDogLoadingSpinner = document.getElementById('dog-loading-spinner');
        const elDogBreedName = document.getElementById('dog-breed-name');
        const elDogProgressBar = document.getElementById('dog-progress-bar');
        const elDogCountdownText = document.getElementById('dog-countdown-text');
        const elBtnNextDog = document.getElementById('btn-next-dog');
        const elIconNextDog = document.getElementById('icon-next-dog');
        const elBtnFavoriteDog = document.getElementById('btn-favorite-dog');
        const elIconFavoriteHeart = document.getElementById('icon-favorite-heart');
        const elFavoriteCount = document.getElementById('favorite-count');
        
        const elBtnGlobalRefresh = document.getElementById('btn-global-refresh');
        const elIconGlobalRefresh = document.getElementById('icon-global-refresh');
        const elBtnGenerateAiTip = document.getElementById('btn-generate-ai-tip');
        const elAiTipText = document.getElementById('ai-tip-text');

        const elFavoritesModal = document.getElementById('favorites-modal');
        const elBtnPrevFavorite = document.getElementById('btn-prev-favorite');
        const elBtnCloseModal = document.getElementById('btn-close-modal');
        const elFavoritesGrid = document.getElementById('favorites-grid');

        function updateClock() {
            const now = new Date();
            elTime.textContent = now.toLocaleTimeString('zh-TW', { hour12: false });
            elDate.textContent = now.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather(lat, lon, locationName) {
            elWeatherSkeleton.classList.remove('hidden');
            elWeatherContent.classList.add('hidden');

            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('天氣資料載入失敗');
                
                const data = await response.json();
                state.currentWeatherData = data;
                state.currentLocationName = locationName;

                renderWeather(data, locationName);
            } catch (err) {
                console.error(err);
                showToast(`天氣資料更新失敗：${err.message}`);
            } finally {
                elWeatherSkeleton.classList.add('hidden');
                elWeatherContent.classList.remove('hidden');
            }
        }

        function renderWeather(data, locationName) {
            const current = data.current;
            const daily = data.daily;

            elWeatherTemp.textContent = Math.round(current.temperature_2m);
            elWeatherApparent.textContent = `${Math.round(current.apparent_temperature)} °C`;
            elWeatherHumidity.textContent = `${current.relative_humidity_2m} %`;
            elWeatherWind.textContent = `${current.wind_speed_10m} km/h`;
            elLocationDisplayText.textContent = locationName;

            // Weather Code Mapping
            const codeInfo = WMO_CODES[current.weather_code] || { desc: '未知天氣', icon: 'fa-cloud text-slate-300' };
            elWeatherDesc.textContent = codeInfo.desc;
            elWeatherIconWrapper.innerHTML = `<i class="fa-solid ${codeInfo.icon}"></i>`;

            // Render 3-Day Forecast
            elForecastContainer.innerHTML = '';
            if (daily && daily.time) {
                for (let i = 1; i <= 3 && i < daily.time.length; i++) {
                    const dateStr = new Date(daily.time[i]).toLocaleDateString('zh-TW', { weekday: 'short' });
                    const code = daily.weather_code[i];
                    const fcInfo = WMO_CODES[code] || { desc: '晴/多雲', icon: 'fa-cloud-sun text-slate-300' };
                    const maxTemp = Math.round(daily.temperature_2m_max[i]);
                    const minTemp = Math.round(daily.temperature_2m_min[i]);

                    const card = document.createElement('div');
                    card.className = 'bg-slate-800/40 border border-slate-700/40 rounded-xl p-2.5 text-center flex flex-col items-center';
                    card.innerHTML = `
                        <span class="text-[11px] text-slate-400 font-medium">${dateStr}</span>
                        <div class="my-1.5 text-lg"><i class="fa-solid ${fcInfo.icon}"></i></div>
                        <span class="text-xs font-semibold text-slate-200">${minTemp}°~${maxTemp}°</span>
                    `;
                    elForecastContainer.appendChild(card);
                }
            }
        }

        async function fetchDogPhoto() {
            elDogLoadingSpinner.classList.remove('opacity-0', 'pointer-events-none');
            elDogImage.classList.add('opacity-0');
            elIconNextDog.classList.add('fa-spin');

            try {
                const response = await fetch('https://dog.ceo/api/breeds/image/random');
                if (!response.ok) throw new Error('狗狗相片載入失敗');
                
                const data = await response.json();
                state.currentDogUrl = data.message;
                state.currentDogBreed = parseBreedFromUrl(data.message);

                // Preload image for smooth transition
                const img = new Image();
                img.src = data.message;
                img.onload = () => {
                    elDogImage.src = data.message;
                    elDogImage.classList.remove('opacity-0');
                    elDogLoadingSpinner.classList.add('opacity-0', 'pointer-events-none');
                    elDogBreedName.textContent = state.currentDogBreed;
                    updateFavoriteHeartIcon();
                };
            } catch (err) {
                console.error(err);
                showToast('無法取得狗狗相片，請檢查網路狀態');
                elDogLoadingSpinner.classList.add('opacity-0', 'pointer-events-none');
            } finally {
                elIconNextDog.classList.remove('fa-spin');
                resetDogTimer();
            }
        }

        // Helper to extract clean breed name from URL
        function parseBreedFromUrl(url) {
            try {
                // Example URL: https://images.dog.ceo/breeds/retriever-golden/n02099601_100.jpg
                const match = url.match(/breeds\/([^\/]+)/);
                if (match && match[1]) {
                    const parts = match[1].split('-');
                    return parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).reverse().join(' ');
                }
            } catch (e) {
                console.error(e);
            }
            return '可愛汪星人';
        }

        function resetDogTimer() {
            state.dogCountdown = DOG_REFRESH_INTERVAL_SEC;
            updateDogProgress();
            
            if (state.dogTimer) clearInterval(state.dogTimer);
            state.dogTimer = setInterval(() => {
                state.dogCountdown--;
                updateDogProgress();
                if (state.dogCountdown <= 0) {
                    fetchDogPhoto();
                }
            }, 1000);
        }

        function updateDogProgress() {
            const pct = (state.dogCountdown / DOG_REFRESH_INTERVAL_SEC) * 100;
            elDogProgressBar.style.width = `${pct}%`;
            elDogCountdownText.textContent = `${state.dogCountdown}s`;
        }

        function updateFavoriteHeartIcon() {
            const isFav = state.favorites.some(f => f.url === state.currentDogUrl);
            if (isFav) {
                elIconFavoriteHeart.className = 'fa-solid fa-heart text-rose-500 text-lg';
            } else {
                elIconFavoriteHeart.className = 'fa-regular fa-heart text-lg';
            }
            elFavoriteCount.textContent = state.favorites.length;
        }

        elBtnFavoriteDog.addEventListener('click', () => {
            if (!state.currentDogUrl) return;

            const index = state.favorites.findIndex(f => f.url === state.currentDogUrl);
            if (index >= 0) {
                state.favorites.splice(index, 1);
                showToast('已取消收藏該照片');
            } else {
                state.favorites.push({
                    url: state.currentDogUrl,
                    breed: state.currentDogBreed,
                    time: new Date().toISOString()
                });
                showToast('❤️ 已將狗狗照片納入收藏！');
            }
            localStorage.setItem('favorite_dogs', JSON.stringify(state.favorites));
            updateFavoriteHeartIcon();
        });

        function renderFavoritesGallery() {
            elFavoritesGrid.innerHTML = '';
            if (state.favorites.length === 0) {
                elFavoritesGrid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-slate-500">
                        <i class="fa-solid fa-heart-crack text-3xl mb-2"></i>
                        <p class="text-sm">尚未收藏任何狗狗相片</p>
                    </div>
                `;
                return;
            }

            state.favorites.forEach((fav, i) => {
                const item = document.createElement('div');
                item.className = 'group relative rounded-xl overflow-hidden bg-slate-800/80 border border-slate-700/60 aspect-square';
                item.innerHTML = `
                    <img src="${fav.url}" class="w-full h-full object-cover transition-transform group-hover:scale-105">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition p-2 flex flex-col justify-between">
                        <button onclick="removeFavorite(${i})" class="self-end p-1.5 bg-slate-900/80 hover:bg-rose-600 text-white rounded-full text-xs transition">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                        <span class="text-[11px] text-amber-300 font-medium truncate">${fav.breed}</span>
                    </div>
                `;
                elFavoritesGrid.appendChild(item);
            });
        }

        window.removeFavorite = function(index) {
            state.favorites.splice(index, 1);
            localStorage.setItem('favorite_dogs', JSON.stringify(state.favorites));
            updateFavoriteHeartIcon();
            renderFavoritesGallery();
        };

        elBtnPrevFavorite.addEventListener('click', () => {
            renderFavoritesGallery();
            elFavoritesModal.classList.remove('hidden');
        });

        elBtnCloseModal.addEventListener('click', () => {
            elFavoritesModal.classList.add('hidden');
        });

        function initLocation() {
            if (navigator.geolocation) {
                showToast('正嘗試取得您的系統 GPS 位置...');
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        state.currentLat = pos.coords.latitude;
                        state.currentLon = pos.coords.longitude;
                        showToast('成功定位當地座標！');
                        fetchWeather(state.currentLat, state.currentLon, '我的目前位置');
                    },
                    (err) => {
                        console.warn('Geolocation failed:', err.message);
                        showToast('無法取得 GPS 定位，已為您預設顯示 [臺北市]');
                        elCitySelect.value = 'taipei';
                        fetchWeather(CITIES['taipei'].lat, CITIES['taipei'].lon, CITIES['taipei'].name);
                    },
                    { timeout: 8000 }
                );
            } else {
                showToast('您的瀏覽器不支援定位，使用預設城市 [臺北市]');
                elCitySelect.value = 'taipei';
                fetchWeather(CITIES['taipei'].lat, CITIES['taipei'].lon, CITIES['taipei'].name);
            }
        }

        // City Selector change handler
        elCitySelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val === 'auto') {
                initLocation();
            } else if (CITIES[val]) {
                const city = CITIES[val];
                state.currentLat = city.lat;
                state.currentLon = city.lon;
                fetchWeather(city.lat, city.lon, city.name);
            }
        });

        elBtnGenerateAiTip.addEventListener('click', async () => {
            if (!state.currentWeatherData) {
                showToast('請稍候天氣載入完成...');
                return;
            }

            elAiTipText.textContent = '狗狗正在思考今日天氣散步建議... 🐾';
            elBtnGenerateAiTip.disabled = true;

            try {
                const temp = Math.round(state.currentWeatherData.current.temperature_2m);
                const weatherDesc = elWeatherDesc.textContent;
                const prompt = `請以一隻可愛友善狗狗口吻（以「本汪」自稱），針對當前天氣（地點：${state.currentLocationName}，氣溫：${temp}度，天氣狀況：${weatherDesc}），給主人一段50字以內超可愛的散步建議或關懷叮嚀。`;

                const apiKey = ""; // Canvas runtime injection
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const result = await response.json();
                const tip = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (tip) {
                    elAiTipText.textContent = `「${tip.trim()}」`;
                } else {
                    elAiTipText.textContent = `「汪！今天天氣 ${temp}度（${weatherDesc}），出門散步記得帶水水跟保持好心情汪！」`;
                }
            } catch (err) {
                console.error(err);
                elAiTipText.textContent = `「汪！氣溫 ${Math.round(state.currentWeatherData.current.temperature_2m)}°C 挺舒適的，快帶本汪出去晃晃吧！」`;
            } finally {
                elBtnGenerateAiTip.disabled = false;
            }
        });

        function showToast(msg) {
            elStatusMessage.textContent = msg;
            elStatusToast.classList.remove('hidden');
            setTimeout(() => {
                elStatusToast.classList.add('hidden');
            }, 5000);
        }

        elBtnNextDog.addEventListener('click', () => {
            fetchDogPhoto();
        });

        elBtnGlobalRefresh.addEventListener('click', () => {
            elIconGlobalRefresh.classList.add('fa-spin');
            fetchWeather(state.currentLat, state.currentLon, state.currentLocationName);
            fetchDogPhoto();
            setTimeout(() => {
                elIconGlobalRefresh.classList.remove('fa-spin');
            }, 1000);
        });

        window.addEventListener('DOMContentLoaded', () => {
            // Initial fetches
            initLocation();
            fetchDogPhoto();

            // Set up 15-min weather timer
            state.weatherTimer = setInterval(() => {
                fetchWeather(state.currentLat, state.currentLon, state.currentLocationName);
            }, WEATHER_REFRESH_INTERVAL_MIN * 60 * 1000);
        });
    </script>
</body>
</html>
